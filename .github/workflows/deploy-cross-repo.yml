name: Deploy Hexo to salmon7.github.io

on:
  push:
    branches:
      - master
    paths:
      - 'source/**'
      - 'scaffolds/**'
      - '_config.yml'
      - '_config.next.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cross-repo.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-hexo-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          TZ: Asia/Shanghai
        run: npx hexo clean && npx hexo generate

      - name: Verify referenced local images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          import posixpath
          import re
          import sys

          public = Path('public')
          site_hosts = {'blog.zhang7long.com'}

          img_pattern = re.compile(r'<img\b[^>]*\bsrc=["\']([^"\']+)["\']', re.IGNORECASE)
          meta_image_pattern = re.compile(
              r'<meta\b[^>]*(?:property|name)=["\'](?:og:image|twitter:image)["\'][^>]*\bcontent=["\']([^"\']+)["\']',
              re.IGNORECASE,
          )

          def refs_from_html(content: str):
              yield from img_pattern.findall(content)
              yield from meta_image_pattern.findall(content)

          def resolve_local_path(raw_ref: str, html_file: Path):
              ref = unquote(raw_ref.split('?', 1)[0].split('#', 1)[0])
              if not ref or ref.startswith(('data:', '//')):
                  return None

              parsed = urlparse(ref)
              if parsed.scheme in ('http', 'https'):
                  if parsed.netloc not in site_hosts:
                      return None
                  rel = parsed.path.lstrip('/')
              elif ref.startswith('/'):
                  rel = ref.lstrip('/')
              else:
                  parent = html_file.relative_to(public).parent.as_posix()
                  rel = f"{parent}/{ref}" if parent != '.' else ref

              rel = posixpath.normpath(rel)
              if rel.startswith('../') or rel == '..':
                  return None
              return rel

          missing = []
          for html in public.rglob('*.html'):
              content = html.read_text(encoding='utf-8', errors='ignore')
              for ref in refs_from_html(content):
                  rel = resolve_local_path(ref, html)
                  if not rel:
                      continue
                  target = public / rel
                  if not target.exists():
                      missing.append((html.as_posix(), ref, rel))

          if missing:
              print('Found missing local image references:')
              for html_file, ref, resolved in missing:
                  print(f'- {html_file}: ref={ref} -> public/{resolved}')
              sys.exit(1)

          print('All local image references (img/src + og:image + twitter:image) are valid.')
          PY

      - name: Verify CNAME
        run: |
          test -f public/CNAME
          grep -qx 'blog.zhang7long.com' public/CNAME

      - name: Publish to salmon7.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PUBLISH_DEPLOY_KEY }}
          external_repository: salmon7/salmon7.github.io
          publish_branch: master
          publish_dir: ./public
          force_orphan: false
          keep_files: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Site updated from HexoBlog: ${{ github.sha }}"